name: Test

on:
  # Fire on every feature-branch push so CI runs as soon as work
  # reaches the remote, independent of PR-event timing. Also fire on
  # PR open/sync against `main` so the check block on the PR page
  # populates on the first push after fork/branch. `main` itself is
  # covered by deploy.yml; running Test on the merge commit here
  # would just be a duplicate of the PR run.
  #
  # Deliberately different from the earlier `push: branches: [main]`
  # + `pull_request` shape: on 2026-07-30 the `pull_request` webhook
  # for PR #17 (fix/remove-load-migrations-from) never scheduled a
  # check_suite — a known intermittent GitHub Actions failure mode.
  # Sibling plugins on the `branches-ignore: [main]` pattern (Menus,
  # Legal, SEO, Cookie, Multilingual) were unaffected because the
  # feature-branch push had already fired their run. Match that shape
  # here so a lost `pull_request` webhook is no longer a single point
  # of failure. `workflow_dispatch` gives operators a manual re-trigger
  # (`gh workflow run Test --ref <branch>`) for the residual case
  # where both push and pull_request events are lost.
  push:
    branches-ignore:
      - main  # main は deploy.yml が実行する
  pull_request:
    branches:
      - next
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.php == '8.3' && matrix.db == 'sqlite' && 'PHPUnit Tests' || format('PHPUnit Tests ({0}, PHP {1})', matrix.db, matrix.php) }}

    # Every PHP version from core's floor (^8.3) up (Dixlase/dixlase-core#977).
    # 8.6 is a development build in setup-php (8.6.0-dev) until it is
    # released, so its legs report but do not fail the workflow; move it
    # into `php` once setup-php lists it as stable. The 8.3 leg keeps the
    # check name the rulesets require, so the extra versions add checks
    # without renaming that one.
    #
    # SQLite accepts values MariaDB refuses (an empty string in an integer
    # or datetime column, for one), so the suite also runs on the database
    # the Docker installer ships (Dixlase/dixlase-core#978). The service
    # container exists for every leg; the SQLite legs ignore it.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb]
        php: ['8.3', '8.4', '8.5']
        experimental: [false]
        include:
          - db: sqlite
            php: '8.6'
            experimental: true
          - db: mariadb
            php: '8.6'
            experimental: true

    services:
      mariadb:
        image: mariadb:12.2.2
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Place plugin into core directory
        run: |
          # Core repo no longer tracks plugins/ (excluded via .gitignore.plugins),
          # so core/plugins/ does not exist after checkout. Create it before mv.
          mkdir -p core/plugins
          rm -rf core/plugins/DixlaseInquiry
          mv plugin core/plugins/DixlaseInquiry

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          # composer.local.json を生成（プラグインの psr-4 マッピングを集約）
          # 通常は pre-autoload-dump フックで実行されるが --no-scripts のため明示実行
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:dGVzdGtleWZvcmRpeGxhc2VpbnF1aXJ5Y2l0ZXN0czEyMzQ1Njc4OQ==
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests (SQLite)
        if: matrix.db == 'sqlite'
        working-directory: core/plugins/DixlaseInquiry
        env:
          APP_KEY: base64:dGVzdGtleWZvcmRpeGxhc2VpbnF1aXJ5Y2l0ZXN0czEyMzQ1Njc4OQ==
        run: ../../vendor/bin/phpunit

      - name: Run PHPUnit tests (MariaDB)
        if: matrix.db == 'mariadb'
        working-directory: core/plugins/DixlaseInquiry
        env:
          APP_KEY: base64:dGVzdGtleWZvcmRpeGxhc2VpbnF1aXJ5Y2l0ZXN0czEyMzQ1Njc4OQ==
          # phpunit.xml's <env> entries are not forced, so these win. Core's
          # TestCase refuses MySQL drivers unless told the database is a
          # disposable one -- which the service container above is.
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_test
          DB_USERNAME: root
          DB_PASSWORD: password
          DLS_TESTS_ALLOW_NON_SQLITE: '1'
        run: ../../vendor/bin/phpunit

  build-frontend:
    runs-on: ubuntu-latest
    name: Verify frontend build
    # Runs `npm run build` on every PR / push so a broken vite config
    # or a missing import surfaces here rather than at release-tag
    # time. The compiled output is discarded — this job only proves
    # the build succeeds; `release.yml` is what actually ships the
    # built artefacts to operators.

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: NODE_ENV=production npm run build

      - name: Verify build output exists
        run: |
          if [ ! -d resources/assets ]; then
            echo "::error::resources/assets/ was not produced by the build"
            exit 1
          fi
          echo "Built:"
          find resources/assets -type f | head -20
